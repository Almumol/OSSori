name: frontend CI

on:
  pull_request:
    branches:
      - 'develop'
      - 'main'
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'module-frontend/**'

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: module-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant permission to gradlew
        run: chmod +x ./gradlew

      - name: Run npmBuild via Gradle
        run: ./gradlew npmBuild --info
